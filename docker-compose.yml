services:
  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - '5173:5173'
    env_file:
      - .env
    environment:
      HUSKY: '0'
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - .:/app
      - web_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  web_modules:
