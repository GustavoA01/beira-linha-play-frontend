# Gera as imagens de produção na máquina que tem o código-fonte.
# Uso: docker compose -f docker-compose.build.yml build
# VITE_API_URL vazio = same-origin /api no nginx.
# Cloudinary fica no .env da API (runtime), não neste build.

services:
  api:
    build: ./beira-linha-play-backend
    image: beira-linha-play-api:latest

  frontend:
    build:
      context: ./beira-linha-play-frontend
      args:
        VITE_API_URL: ''
    image: beira-linha-play-frontend:latest
