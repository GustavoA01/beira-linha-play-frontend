# Overlay HTTPS. Não use no primeiro deploy (HTTP no IP).
# docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
# Precisa de Compose v2.24+ (`ports: !reset`).
#
# No .env da VPS:
#   APP_DOMAIN=app.seudominio.com
#   APP_ALLOWED_HOSTS=https://app.seudominio.com
#   APP_COOKIE_SECURE=true
# DNS: registro A de APP_DOMAIN apontando para o IP da VPS.

services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.9-alpine
    container_name: beira-linha-play-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: beira-linha-play
    driver: bridge
